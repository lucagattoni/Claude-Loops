site_name: Claude Loops
site_description: >-
  Two disciplines, kept separate: loop engineering — designing autonomous agent
  loops that observe, plan, act, verify and iterate — and developing software
  efficiently with Claude Code.
site_url: https://lucagattoni.github.io/Claude-Loops/
site_author: Luca Gattoni
copyright: Claude Loops — loop engineering, and developing with Claude Code

repo_url: https://github.com/lucagattoni/Claude-Loops
repo_name: lucagattoni/Claude-Loops
edit_uri: edit/main/docs/

# docs/ is the source; LOOP_ENGINEERING.md + README.md stay the GitHub repo landing.
docs_dir: docs

# Broken internal links/anchors warn (promoted to errors under `--strict` in CI).
# Intentional absolute github.com links to repo files are left alone.
validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  links:
    anchors: warn

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Left column — collapsible navigation tree
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    # Right column — on-this-page TOC (kept separate, NOT integrated, so it stays a 3rd column)
    - toc.follow
    # Search + code ergonomics
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search

# External links open in a new tab with an external-link icon (see the JS + CSS below).
extra_css:
  - stylesheets/external-links.css
extra_javascript:
  - javascripts/external-links.js
  - javascripts/section-numbering.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lucagattoni/Claude-Loops

# Left navigation — two clearly separated parts.
#   PART I  is general and tool-agnostic: usable by a reader on any coding agent.
#   PART II is Claude Code specific, concrete and version-stamped.
# Chapter numbers are display-only. The docs/NN- filenames are the stable identifiers
# and never change when docs are regrouped.
nav:
  - Home: index.md

  - Part I — Loop Engineering:
      - 1. Foundations:
          - 1.1 The Paradigm Shift: 01-paradigm-shift.md
          - 1.2 The Core Agent Loop Cycle: 02-agent-loop-cycle.md
          - 1.3 Loop Maturity Model: 20-loop-maturity-model.md
          - 1.4 Context vs. Loop Engineering: 21-context-vs-loop-engineering.md
          - 1.5 The Factory Model: 26-factory-model.md
      - 2. Designing a Loop:
          - 2.1 The Loop Contract: 27-loop-contract.md
          - 2.2 Goal Engineering: 30-goal-engineering.md
          - 2.3 Harness Patterns: 24-harness-patterns.md
          - 2.4 Loop Patterns Catalog: 34-loop-patterns.md
      - 3. Verification & Failure:
          - 3.1 Verification: 04-verification.md
          - 3.2 Common Failure Patterns: 17-failure-patterns.md
          - 3.3 Human-in-the-Loop Escalation: 14-human-in-the-loop.md
      - 4. Scaling:
          - 4.1 Fan-Out: 10-fan-out.md
          - 4.2 Fleet Engineering: 23-fleet-engineering.md
          - 4.3 Learned Orchestration: 22-learned-orchestration.md
          - 4.4 Long-Running Agents: 25-long-running-agents.md

  - Part II — Developing with Claude Code:
      - 5. Start Here:
          - 5.1 Choosing Your Mode: 35-choosing-your-mode.md
      - 6. The Workflow:
          - 6.1 The Development Workflow: 36-development-workflow.md
          - 6.2 Session Architecture: 37-session-architecture.md
          - 6.3 Explore → Plan → Implement → Commit: 15-explore-plan-implement.md
      - 7. Your Setup:
          - 7.1 CLAUDE.md: 05-claude-md.md
          - 7.2 Skills: 06-skills.md
          - 7.3 Hooks: 12-hooks.md
          - 7.4 Permissions & Auto Mode: 08-permissions.md
          - 7.5 The Six Building Blocks: 03-building-blocks.md
          - 7.6 Memory Patterns: 16-memory-patterns.md
          - 7.7 Context Management: 13-context-management.md
      - 8. Parallel Work:
          - 8.1 Subagents: 07-subagents.md
          - 8.2 Agent Teams: 38-agent-teams.md
          - 8.3 Dynamic Workflows: 39-dynamic-workflows.md
      - 9. Running Unattended:
          - 9.1 Headless & Non-Interactive Mode: 09-headless-mode.md
          - 9.2 Routines: 28-routines.md
          - 9.3 Background Agents: 29-background-agents.md
          - 9.4 Claude Tag: 31-claude-tag.md
      - 10. Cost & Safety:
          - 10.1 Cost & Turn Control: 11-cost-control.md
          - 10.2 MCP Security: 19-mcp-security.md
          - 10.3 Agent Security Hardening: 33-agent-security-hardening.md

  - 11. Reference:
      - 11.1 Quick Reference: 18-quick-reference.md
      - 11.2 Reading List: 32-reading-list.md
  - 12. Project:
      - 12.1 News Digest: news.md
      - 12.2 Sources: sources.md
      - 12.3 Changelog: changelog.md
