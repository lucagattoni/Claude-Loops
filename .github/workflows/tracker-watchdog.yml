name: tracker-watchdog

# Off-machine staleness alarm for the KB tracker.
#
# The tracker runs on a laptop — on demand since v3.7.0 (20260912), on a launchd schedule before
# that — and reports failures to a desktop notification and a gitignored log, both on the machine
# that failed. Between 2026-07-20 and 2026-09-05 it published
# nothing and nothing said so. This job runs somewhere else and asserts on the published artifact,
# so a dead scheduler, a dead pipeline and a closed laptop all surface the same way: a red run.
#
# It cannot fail silently in the direction that matters: an unreadable or unparseable digest exits
# non-zero, the same as a stale one. "I could not tell" is never reported as "fine".

on:
  schedule:
    # 09:00 UTC daily. Since v3.7.0 the tracker runs ON DEMAND, so there is no fixed fire time for
    # this to sit "4-5h after"; the daily cron is simply how often the staleness question gets
    # asked. MAX_AGE_HOURS (336 = 14 days, in scripts/check-digest-freshness.sh) is a staleness
    # threshold, not a same-day retry margin, so GitHub delaying a scheduled run is irrelevant.
    - cron: '0 9 * * *'
  workflow_dispatch:      # so the alarm can be tested on demand, not only observed in anger
  push:
    paths:
      - .github/workflows/tracker-watchdog.yml
      - scripts/check-digest-freshness.sh

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Digest freshness
        # MAX_AGE_HOURS is deliberately NOT set here. Its one home is
        # scripts/check-digest-freshness.sh (336 = 14 days). Overriding it at this call site would
        # let CI and `run-loop-news-now.sh --status` report opposite verdicts on the same digest.
        # (D4, resolved 20260921.)
        run: bash scripts/check-digest-freshness.sh
