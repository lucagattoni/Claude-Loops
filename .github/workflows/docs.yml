name: docs

# Build the MkDocs site on every PR (strict = broken links fail the check),
# and deploy to GitHub Pages on push to main.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
      # Published as the in-nav pages news.md / sources.md / changelog.md via symlinks in
      # docs/. Editing a root file leaves the symlink blob unchanged, so without these a
      # findings-only pipeline day would rebuild nothing and still show a green history.
      - LOOP_ENGINEERING_NEWS.md
      - SOURCES.md
      - CHANGELOG.md
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
      # Published as the in-nav pages news.md / sources.md / changelog.md via symlinks in
      # docs/. Editing a root file leaves the symlink blob unchanged, so without these a
      # findings-only pipeline day would rebuild nothing and still show a green history.
      - LOOP_ENGINEERING_NEWS.md
      - SOURCES.md
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements-docs.txt
      # uv provisions Python + an ephemeral env from requirements-docs.txt, then builds.
      - run: uv run --with-requirements requirements-docs.txt mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only publish from main, never from a PR.
    if: github.ref == 'refs/heads/main'
    needs: build
    # Serialize Pages deploys so rapid pushes can't deploy out of order:
    # one deploy at a time; a newer run supersedes an older *pending* one, but an
    # in-flight deploy is never cancelled — so the newest commit always wins last.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
